<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Funcionários</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topo">
        <h1>Controle de Reposição de Medicamentos</h1>
        <nav class="menu">
            <a href="/">Painel</a>
            <a href="/funcionarios" class="ativo">Funcionários</a>
            <a href="/pedidos">Novo pedido</a>
        </nav>
    </header>

    <main class="conteudo">
        <h2>Cadastro de Funcionários</h2>
        <div id="mensagem" class="mensagem" hidden></div>

        <form id="form-funcionario" class="form" novalidate>
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" maxlength="100" placeholder="Ex: Rafael Silva">

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" maxlength="150" placeholder="Ex: rafael@email.com">

            <button type="submit">Cadastrar funcionário</button>
        </form>

        <h3>Funcionários cadastrados</h3>
        <ul id="lista-funcionarios" class="lista-simples"></ul>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", initPaginaFuncionarios);
    </script>
</body>
</html>
